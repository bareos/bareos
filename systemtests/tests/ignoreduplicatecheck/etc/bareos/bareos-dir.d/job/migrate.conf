Job {
  Name = "Migrate"
  Type = Migrate
  Pool = Full
  Next Pool = CopyMigrate
  Selection Type = SQL Query
  # Canceled copy jobs leave empty Full records with the source's StartTime.
  Selection Pattern = "SELECT JobId FROM Job WHERE Name='ai-backup-bareos-fd' AND Type='B' AND Level='F' AND JobStatus='T' AND JobFiles>0 ORDER BY StartTime DESC, JobId DESC LIMIT 1"
  Client = "bareos-fd"
  Messages = Standard
  # Sleep up to 60s if this is a migrate worker job
  Run Before Job = "sh -c 'test \"%O\" != \"*None*\" && sleep 5 || exit 0'"
  Run Before Job = "sh -c 'test \"%O\" != \"*None*\" && sleep 5 || exit 0'"
