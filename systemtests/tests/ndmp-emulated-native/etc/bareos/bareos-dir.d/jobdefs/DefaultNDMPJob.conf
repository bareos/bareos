JobDefs {
  Name = "DefaultNDMPJob"
  Type = Backup
  Protocol = NDMP_NATIVE
  Level = Incremental
  Client = ndmjob
  Backup Format = dump
#  Backup Format = tar
  FileSet = "ndmp-fileset"
  Storage = ndmjob
  Messages = Standard
  Pool = ndmp-tape
  Priority = 10
  Save File History = Yes
  Maximum Concurrent Jobs = 2
}
